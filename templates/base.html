<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{% block title %}Vexmont{% endblock %}</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vexmont">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=3">
</head>
<body>
<div class="app">
  {% block header %}{% endblock %}
  <main>
    {% for m in get_flashed_messages() %}<div class="flash">{{ m }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
  {% if g.user and g.user.status == 'active' %}
  <nav class="bottom">
    <a href="{{ url_for('stages') }}" class="{{ 'on' if nav=='stages' }}"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 7l2 2 3-4M12 7h8M4 16l2 2 3-4M12 16h8"/></svg>{% if tasks_n %}<span class="nbadge">{{ tasks_n }}</span>{% endif %}</span>Этапы</a>
    <a href="{{ url_for('home') }}" class="{{ 'on' if nav=='home' }}"><span class="ic"><svg viewBox="0 0 24 24"><path d="M5 21V4h10v17M15 8h4v13M3 21h18"/><path d="M12 12h.01"/></svg></span>Квартиры</a>
    <a href="{{ url_for('profile') }}" class="{{ 'on' if nav=='profile' }}"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></span>Профиль</a>
  </nav>
  {% endif %}
</div>
<script>if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script>
{% block scripts %}{% endblock %}
</body>
</html>
