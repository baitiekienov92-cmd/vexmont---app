{% extends "base.html" %}{% block title %}Регистрация — Vexmont{% endblock %}
{% block content %}
<div class="auth">
  <div class="logo">V</div>
  <h1>Регистрация</h1>
  <p class="small">После регистрации администратор подтвердит доступ и откроет ваши объекты.</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf() }}">
    <label>Имя и фамилия</label><input name="name" value="{{ request.form.name }}" autocomplete="name" required>
    <label>Телефон</label><input name="phone" type="tel" inputmode="tel" value="{{ request.form.phone }}" placeholder="+7 7__ ___ __ __" autocomplete="tel" required>
    <label>Компания (необязательно)</label><input name="company" value="{{ request.form.company }}">
    <label>Должность</label>
    <select name="role" required>
      {% for k, v in ROLES.items() if k != 'admin' %}<option value="{{ k }}" {{ 'selected' if (request.form.role or 'prorab') == k }}>{{ v }}</option>{% endfor %}
    </select>
    <label>Пароль (минимум 6 символов)</label><input name="password" type="password" autocomplete="new-password" minlength="6" required>
    <button class="btn navy full" style="margin-top:16px">Зарегистрироваться</button>
  </form>
  <p class="small" style="text-align:center;margin-top:18px">Уже есть аккаунт? <a href="{{ url_for('login') }}" style="color:var(--navy);font-weight:600">Войти</a></p>
</div>
{% endblock %}
