{% extends "base.html" %}{% block title %}Вход — Vexmont{% endblock %}
{% block content %}
<div class="auth">
  <div class="logo">V</div>
  <h1>Вход</h1>
  <p class="small">Прорабы, ОКК и заказчики Vexmont</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf() }}">
    <label>Телефон</label><input name="phone" type="tel" inputmode="tel" placeholder="+7 7__ ___ __ __" autocomplete="tel" required>
    <label>Пароль</label><input name="password" type="password" autocomplete="current-password" required>
    <button class="btn navy full" style="margin-top:16px">Войти</button>
  </form>
  <p class="small" style="text-align:center;margin-top:18px">Нет аккаунта? <a href="{{ url_for('register') }}" style="color:var(--navy);font-weight:600">Зарегистрироваться</a></p>
</div>
{% endblock %}
